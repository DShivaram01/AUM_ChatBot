name: aum_chatbot
channels:
  - conda-forge
dependencies:
  - python=3.11.15
  - pip
  - faiss=1.8.0
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0+cu124
